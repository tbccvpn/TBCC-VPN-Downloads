name: Mirror stable TBCC VPN releases

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the approved stable release after verification
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: tbcc-stable-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'tbccvpn/TBCC-VPN-Downloads' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify mirror rules
        run: |
          node --test tests/*.test.mjs
          python3 -B -m unittest discover -s tests -p test_manual_catalog.py
      - name: Check approved stable rollout
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            node scripts/mirror-stable.mjs --publish
          else
            node scripts/mirror-stable.mjs
          fi
